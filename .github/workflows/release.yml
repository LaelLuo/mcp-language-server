name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
          cache: true

      - name: Set version var
        id: vars
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN_NAME="mcp-language-server"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          OUT="dist/${BIN_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          go mod download
          go build -trimpath -ldflags "-s -w" -o "$OUT"

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="mcp-language-server"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          ARCHIVE="${BIN_NAME}_${{ steps.vars.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "pack/${ARCHIVE}"
          cp "dist/${BIN_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" "pack/${ARCHIVE}/${BIN_NAME}${EXT}"
          # Include helpful docs if present
          [ -f README.md ] && cp README.md "pack/${ARCHIVE}/" || true
          [ -f LICENSE ] && cp LICENSE "pack/${ARCHIVE}/" || true
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd pack && zip -r "../dist/${ARCHIVE}.zip" "${ARCHIVE}")
          else
            (cd pack && tar -czf "../dist/${ARCHIVE}.tar.gz" "${ARCHIVE}")
          fi

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          # Create SHA256SUMS for this OS/ARCH
          find dist -maxdepth 1 -type f \( -name "*.tar.gz" -o -name "*.zip" \) -printf '%P\n' \
            | xargs -r -I {} sha256sum "dist/{}" \
            > "dist/SHA256SUMS_${{ matrix.goos }}_${{ matrix.goarch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: dist

      - name: Combine checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat SHA256SUMS_* > SHA256SUMS || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

